<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jejak Anak Hebat</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--sky:#e6f2ff;--sun:#ffc21a;--leaf:#2e9e6b;--coral:#ff6b57;--line:#c9dcf2}
*{box-sizing:border-box}
body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;font-weight:500;background:var(--sky);color:var(--ink);font-size:17px;line-height:1.35}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
h1{margin:0;font-size:2rem;line-height:1.1}
header p{margin:2px 0 0;opacity:.75}
#tabs{display:flex;gap:6px;max-width:760px;margin:10px auto 0;padding:0 16px}
#tabs button{flex:1;border:2px solid var(--ink);background:#fff;border-radius:14px 14px 0 0;padding:8px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
#tabs button.on{background:var(--sun)}
main{max-width:760px;margin:auto;padding:0 16px 40px}
.card{background:#fff;border:2px solid var(--ink);border-radius:0 0 18px 18px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:1.3rem}
h3{margin:14px 0 6px;font-size:1.05rem}
label{display:block;margin:8px 0;font-weight:700}
input,select,textarea{display:block;width:100%;font:inherit;padding:9px 10px;border:2px solid var(--line);border-radius:10px;margin-top:4px;color:var(--ink);background:#fff}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--coral);outline-offset:2px}
.big,.sec{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;color:var(--ink)}
.big{background:var(--sun);width:100%;margin-top:8px}
.sec{background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1 1 150px}
.dots{display:flex;gap:6px;margin:6px 0 12px}
.dot{flex:1;text-align:center;padding:6px 0;border-radius:12px;border:2px dashed var(--line);font-size:.85rem}
.dot.f{background:var(--leaf);border:2px solid var(--leaf);color:#fff}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;margin:0;border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:500}
.chip input{width:22px;height:22px;margin:0;accent-color:var(--leaf)}
.chip.on{border-color:var(--leaf);background:#e9f8f0;font-weight:700}
.moods{display:flex;gap:6px}
.mood{flex:1;font-size:1.8rem;padding:6px 0;border:2px solid var(--line);border-radius:12px;background:#fff}
.mood small{display:block;font-size:.7rem;font-family:inherit}
.mood.on{border-color:var(--coral);background:#fff0ed}
.item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px;margin-bottom:8px;color:var(--ink)}
.note{font-size:.9rem;opacity:.8}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left}
th{background:#fff3c4}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><h1>Jejak Anak Hebat</h1><p>Jurnal harian kebiasaan baikku</p></header>
<nav id="tabs"></nav>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
/* ====== PENGATURAN (ubah di sini) ====== */
const CONFIG={
  sekolah:"SDN Dayeuhkolot 05",
  driveLink:"https://drive.google.com/drive/folders/108OCfcM39MXXB6SUe-nsWb7ru3qAIARr?usp=drive_link",     // tempel link folder Google Drive tujuan unggah di antara tanda kutip
  pin:"1234"        // PIN halaman Guru
};
const HABITS=[["bangun","Bangun pagi"],["ibadah","Beribadah"],["makan","Makan sehat"],["bantu","Membantu orang tua"],["belajar","Belajar / membaca"],["olahraga","Berolahraga"],["tidur","Tidur tepat waktu"]];
const MOODS=[["😄","Senang"],["🙂","Baik"],["😐","Biasa"],["😢","Sedih"],["😠","Marah"]];
/* ======================================= */

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Penyimpanan di perangkat ini tidak bisa dipakai")}}
const today=()=>new Date().toLocaleDateString("sv");
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("sv")};
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtS=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
function toast(t){const e=$("#toast");e.textContent=t;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2600)}

let prof=ld("jah_prof",null),ent=ld("jah_ent",{}),G=ld("jah_guru",{}),tab="isi",date=today(),unlocked=false,V={k:"",a:"",b:""};

function render(){
  $("#tabs").innerHTML=[["isi","Isi Jurnal"],["riwayat","Riwayat"],["guru","Guru"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
  $("#app").innerHTML=tab=="isi"?vIsi():tab=="riwayat"?vRiwayat():vGuru();
}

/* ---------- SISWA ---------- */
function vIsi(){
  if(!prof)return `<section class="card"><h2>Kenalan dulu, yuk!</h2>
  <label>Nama lengkap<input id="nm" autocomplete="name"></label>
  <label>Kelas<select id="kl">${[1,2,3,4,5,6].map(k=>`<option>${k}</option>`).join("")}</select></label>
  <button class="big" onclick="saveProf()">Mulai menulis jurnal</button></section>`;
  const e=ent[date]||{h:[],m:-1,c:""};
  let dots="";
  for(let i=6;i>=0;i--){const d=addDays(today(),-i);dots+=`<span class="dot ${ent[d]?"f":""}">${new Date(d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"short"})}</span>`}
  return `<section class="card">
  <h2>Halo, ${esc(prof.nama)}! (Kelas ${esc(prof.kelas)})</h2>
  <div class="note">Jejakku 7 hari terakhir</div><div class="dots">${dots}</div>
  <label>Tanggal<input type="date" value="${date}" max="${today()}" onchange="date=this.value||today();render()"></label>
  <div class="note" id="jam">${e.t?"Terakhir diisi pukul "+jam(e.t):"Jam tercatat otomatis saat kamu mengisi"}</div>
  <h3>Hari ini aku sudah...</h3>
  <div class="chips">${HABITS.map(([id,l])=>{const on=e.h.includes(id);return `<label class="chip ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="tog('${id}',this)">${l}</label>`}).join("")}</div>
  <h3>Perasaanku hari ini</h3>
  <div class="moods">${MOODS.map((m,i)=>`<button class="mood ${e.m==i?"on":""}" onclick="setM(${i})" aria-label="${m[1]}">${m[0]}<small>${m[1]}</small></button>`).join("")}</div>
  <label>Ceritaku hari ini<textarea oninput="setC(this.value)" placeholder="Tulis satu hal baik yang kamu lakukan hari ini">${esc(e.c)}</textarea></label>
  <div class="row"><button class="big" onclick="kirimDrive()">Kirim jurnal ke Guru (Google Drive)</button></div>
  <p class="note">Jurnal tersimpan otomatis di perangkat ini. Setelah selesai, tekan tombol kirim: file jurnal akan terunduh, lalu unggah file itu di folder Google Drive yang terbuka.</p>
  <button class="sec" onclick="if(confirm('Ganti nama dan kelas? Jurnal yang sudah ada tetap tersimpan.')){prof=null;render()}">Ganti nama / kelas</button>
  </section>`;
}
function saveProf(){const n=$("#nm").value.trim();if(!n)return toast("Tulis namamu dulu ya");prof={nama:n,kelas:$("#kl").value};sv("jah_prof",prof);render()}
function ensure(){return ent[date]||(ent[date]={h:[],m:-1,c:"",t:""})}
const jam=t=>t?t.replace(":","."):"-";
function stamp(e){e.t=new Date().toLocaleTimeString("sv").slice(0,5);sv("jah_ent",ent);const j=$("#jam");if(j)j.textContent="Terakhir diisi pukul "+jam(e.t)}
function tog(id,el){const e=ensure();e.h=e.h.filter(x=>x!=id);if(el.checked)e.h.push(id);el.parentNode.classList.toggle("on",el.checked);stamp(e)}
function setM(i){const e=ensure();e.m=i;stamp(e);render()}
function setC(v){const e=ensure();e.c=v;stamp(e)}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s))));
function pay(ds){return{v:1,n:prof.nama,k:prof.kelas,e:ds.filter(d=>ent[d]).map(d=>({d,h:ent[d].h,m:ent[d].m,c:ent[d].c,t:ent[d].t||""}))}}
function kirimDrive(){
  if(!Object.keys(ent).length)return toast("Isi jurnalnya dulu ya");
  dl("jurnal-"+prof.nama.replace(/\s+/g,"-")+"-kelas"+prof.kelas+"-"+today()+".json","application/json",JSON.stringify(pay(Object.keys(ent).sort())),true);
  if(CONFIG.driveLink){window.open(CONFIG.driveLink,"_blank");toast("File terunduh. Unggah file itu di folder Google Drive yang terbuka.")}
  else toast("File terunduh, tetapi link Google Drive belum diatur oleh guru")
}
function vRiwayat(){
  const ds=Object.keys(ent).sort().reverse();
  if(!ds.length)return `<section class="card"><h2>Riwayat jurnalku</h2><p>Belum ada jurnal. Mulai dari tab Isi Jurnal.</p></section>`;
  return `<section class="card"><h2>Riwayat jurnalku</h2>${ds.map(d=>{const e=ent[d];return `<button class="item" onclick="date='${d}';tab='isi';render()"><span>${fmtS(d)}, pukul ${jam(e.t)}</span><span>${e.m>=0?MOODS[e.m][0]:""} ${e.h.length}/${HABITS.length} kebiasaan</span></button>`}).join("")}</section>`;
}

/* ---------- GURU ---------- */
function vGuru(){
  if(!unlocked)return `<section class="card"><h2>Halaman Guru</h2><label>PIN<input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key=='Enter')unlock()"></label><button class="big" onclick="unlock()">Buka</button></section>`;
  const rows=rekap(),kls=[...new Set(Object.values(G).map(x=>x.k))].sort();
  return `<section class="card"><h2>Terima jurnal siswa</h2>
  <label>Pilih file jurnal (.json) yang diunduh dari folder Google Drive, boleh banyak sekaligus<input type="file" id="files" accept=".json,.txt" multiple></label>
  <button class="big" onclick="doImp()">Gabungkan data</button>
  <p class="note">Data guru tersimpan di peramban perangkat ini. Unduh rekap secara berkala sebagai cadangan.</p></section>
  <section class="card"><h2>Rekap</h2>
  <div class="row"><label>Kelas<select onchange="V.k=this.value;render()"><option value="">Semua</option>${kls.map(k=>`<option ${V.k==k?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
  <label>Dari<input type="date" value="${V.a}" onchange="V.a=this.value;render()"></label>
  <label>Sampai<input type="date" value="${V.b}" onchange="V.b=this.value;render()"></label></div>
  ${rows.length?`<div class="scroll">${tblRekap(rows)}</div>
  <div class="row"><button class="big" onclick="dlRekap()">Unduh rekap kelas (Excel)</button></div>
  <h3>Jurnal perorangan (Word)</h3>
  <div class="row"><select id="stu"><option value="-1">Semua siswa (satu siswa per halaman)</option>${rows.map((r,i)=>`<option value="${i}">${esc(r.n)} (Kelas ${esc(r.k)})</option>`).join("")}</select><button class="sec" onclick="dlWord()">Unduh jurnal</button></div>`:`<p>Belum ada data. Pilih file jurnal siswa di atas.</p>`}
  <div class="row"><button class="sec" onclick="if(confirm('Hapus SEMUA data siswa di perangkat ini?')){G={};sv('jah_guru',G);render()}">Hapus semua data guru</button></div></section>`;
}
function unlock(){if($("#pin").value==CONFIG.pin){unlocked=true;render()}else toast("PIN salah")}
function imp(txt){
  let n=0,found=0,m;
  const add=p=>{if(!p||!p.n||!Array.isArray(p.e))return;p.e.forEach(e=>{if(!e.d)return;const nm=String(p.n).trim();G[(nm+"|"+p.k+"|"+e.d).toLowerCase()]={n:nm,k:String(p.k),d:e.d,h:e.h||[],m:e.m==null?-1:e.m,c:e.c||"",t:e.t||""};n++})};
  const re=/JAH1:([A-Za-z0-9+\/=]+)/g;
  while((m=re.exec(txt))){found=1;try{add(dec(m[1]))}catch(e){}}
  if(!found){try{add(JSON.parse(txt))}catch(e){}}
  return n;
}
function doImp(){
  const fs=Array.from($("#files").files),t="";
  Promise.all(fs.map(f=>f.text())).then(a=>{
    let n=imp(t);a.forEach(x=>n+=imp(x));sv("jah_guru",G);
    toast(n?n+" jurnal berhasil digabung":"Tidak ada jurnal yang terbaca");render();
  });
}
function rekap(){
  const g={};
  Object.values(G).filter(x=>(!V.k||x.k==V.k)&&(!V.a||x.d>=V.a)&&(!V.b||x.d<=V.b)).forEach(x=>{
    const key=(x.n+"|"+x.k).toLowerCase();(g[key]=g[key]||{n:x.n,k:x.k,ents:[]}).ents.push(x)});
  return Object.values(g).map(r=>{r.ents.sort((a,b)=>a.d<b.d?-1:1);r.days=r.ents.length;r.hc={};HABITS.forEach(h=>r.hc[h[0]]=r.ents.filter(e=>e.h.includes(h[0])).length);return r})
    .sort((a,b)=>a.k.localeCompare(b.k)||a.n.localeCompare(b.n));
}
function tblRekap(rows){
  return `<table border="1"><tr><th>Nama</th><th>Kelas</th><th>Hari terisi</th>${HABITS.map(h=>`<th>${h[1]}</th>`).join("")}</tr>${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.k)}</td><td>${r.days}</td>${HABITS.map(h=>`<td>${r.hc[h[0]]}/${r.days}</td>`).join("")}</tr>`).join("")}</table>`;
}
function office(body){return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>@page{size:landscape}body{font-family:Calibri,Arial}th{background:#ffe38a}</style></head><body>${body}</body></html>`}
function dlRekap(){
  const per=(V.a||V.b)?`Periode: ${V.a||"awal"} s.d. ${V.b||"sekarang"}`:"Semua tanggal";
  dl("rekap-jurnal-anak-hebat.xls","application/vnd.ms-excel",office(`<h3>Rekap Jurnal Jejak Aktivitas dan Kebiasaan Anak Hebat - ${esc(CONFIG.sekolah)}</h3><p>${per}${V.k?" - Kelas "+esc(V.k):""}</p>${tblRekap(rekap())}`));
}
function docStu(r){
  return `<h2>Jurnal Jejak Aktivitas dan Kebiasaan Anak Hebat</h2><p><b>${esc(r.n)}</b> - Kelas ${esc(r.k)} - ${esc(CONFIG.sekolah)}<br>Jurnal terisi: ${r.days} hari</p>
  <table border="1" cellpadding="4" style="border-collapse:collapse;font-size:10pt"><tr><th>Tanggal</th><th>Jam</th>${HABITS.map(h=>`<th>${h[1]}</th>`).join("")}<th>Perasaan</th><th>Cerita</th></tr>
  ${r.ents.map(e=>`<tr><td>${fmtS(e.d)}</td><td>${jam(e.t)}</td>${HABITS.map(h=>`<td align="center">${e.h.includes(h[0])?"&#10003;":"-"}</td>`).join("")}<td>${e.m>=0?MOODS[e.m][1]:"-"}</td><td>${esc(e.c)}</td></tr>`).join("")}</table>
  <p>Ringkasan: ${HABITS.map(h=>`${h[1]} ${r.hc[h[0]]}/${r.days}`).join("; ")}.</p>`;
}
function dlWord(){
  const rows=rekap(),i=+$("#stu").value,list=i<0?rows:[rows[i]];
  dl(i<0?"jurnal-semua-siswa.doc":"jurnal-"+rows[i].n.replace(/\s+/g,"-")+".doc","application/msword",office(list.map(docStu).join('<br clear="all" style="page-break-before:always">')));
}
function dl(n,m,b,plain){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([plain?b:"\ufeff"+b],{type:m+";charset=utf-8"}));a.download=n;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
render();
</script>
</body>
</html>
